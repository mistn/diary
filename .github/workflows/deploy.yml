# push 到 main 即自动部署到 Cloudflare，并把 GitHub 里的 ADMIN_PASSWORD 同步为 Worker secret
# 以后改密码只改 GitHub Secrets，push 即生效，本地再也不用 wrangler secret put
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions，跟备份共用前 5 个）：
#   CLOUDFLARE_API_TOKEN   用 “Edit Cloudflare Workers” 模板建，再手动 + 一行：帐户 / D1 / 读取
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 后台链接里那串 account id
#   ADMIN_PASSWORD         写文章的密码（注意用 printf 传，不带换行，echo 会多带个换行导致登录失败）
#   TURNSTILE_SECRET       Turnstile 密钥（登录人机校验用，同样 printf 传）
#   WEBDAV_URL / WEBDAV_USERNAME / WEBDAV_PASSWORD  备份用（见 backup.yml）
#   CF_ANALYTICS_TOKEN     可选，Cloudflare Web Analytics；配了自动同步，不配没有统计脚本

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # 手动点一次也行

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }} # 可选
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 wrangler
        run: npm install -g wrangler@3

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: 同步管理员密码
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD

      - name: 同步 Turnstile 密钥
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: printf '%s' "$TURNSTILE_SECRET" | wrangler secret put TURNSTILE_SECRET

      - name: 同步 PWA 图标到 R2
        continue-on-error: true # 需要 token 有 R2 编辑权限（Cloudflare → API 令牌 → 该令牌 → 添加：帐户 / Worker R2 Storage / 编辑）；没有则跳过，不影响部署
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-32.png; do
            npx wrangler r2 object put "diary-img/pwa/$f" --file "icons/$f" --remote --content-type image/png
          done

      - name: 同步 Web Analytics（可选，未配置则跳过）
        if: env.CF_ANALYTICS_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$CF_ANALYTICS_TOKEN" | wrangler secret put CF_ANALYTICS_TOKEN
